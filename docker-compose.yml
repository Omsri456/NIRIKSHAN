  #   depends_on:
  #     - mongo

  # ── ML Service (uncomment when ready to containerize) ───
  # ml:
  #   build: ./ml
  #   container_name: nirikshan-ml
  #   ports:
  #     - "8000:8000"

volumes:
  mongo-data:
